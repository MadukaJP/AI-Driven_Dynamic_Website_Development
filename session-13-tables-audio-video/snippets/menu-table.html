<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Menu Table</title>
<style>
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; border: 1px solid #ddd; text-align: left; }
</style>
</head>
<body>
  <table>
    <thead>
      <tr><th>Dish</th><th>Price</th><th>Calories</th></tr>
    </thead>
    <tbody>
      <tr><td>Avocado Toast</td><td>$9</td><td>320</td></tr>
      <tr><td>Iced Latte</td><td>$5</td><td>150</td></tr>
      <tr><td>Grilled Salmon</td><td>$18</td><td>480</td></tr>
    </tbody>
  </table>
</body>
</html>
