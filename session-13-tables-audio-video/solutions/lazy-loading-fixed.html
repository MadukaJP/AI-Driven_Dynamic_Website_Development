<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Lazy Loading Fixed</title></head>
<body>
  <!-- Hero image loads immediately since it's above the fold -->
  <img src="hero.jpg" alt="Hero banner">
  <img src="dish1.jpg" alt="Dish 1" loading="lazy">
  <img src="dish2.jpg" alt="Dish 2" loading="lazy">
  <img src="dish3.jpg" alt="Dish 3" loading="lazy">
  <img src="dish4.jpg" alt="Dish 4" loading="lazy">
</body>
</html>
