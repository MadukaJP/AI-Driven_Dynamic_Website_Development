<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warm-up 5: One Click, Many Boxes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <h1>Warm-up 5: One Click, Many Boxes</h1>
    <p class="subtitle">Click any box below. One single listener on the container figures out WHICH box was clicked.</p>
    <div class="item-list" id="box-list">
      <div class="box" data-name="Box A">Box A</div>
      <div class="box" data-name="Box B">Box B</div>
      <div class="box" data-name="Box C">Box C</div>
      <div class="box" data-name="Box D">Box D</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
