<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>New Form Elements</title></head>
<body>
  <label for="browser">Preferred browser</label>
  <input list="browsers" id="browser" name="browser">
  <datalist id="browsers">
    <option value="Chrome">
    <option value="Firefox">
    <option value="Safari">
  </datalist>

  <p>Upload progress: <progress value="70" max="100"></progress></p>
  <p>Spice level: <meter value="6" min="0" max="10"></meter></p>

  <input type="hidden" name="form_source" value="homepage-contact">
</body>
</html>
