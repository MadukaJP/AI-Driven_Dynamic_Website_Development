<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 50px;
        height: 70px;
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* .box:nth-child(even) {
        background-color: red;
      }

      .box:nth-child(odd) {
        background-color: yellow;
      } */

      .box:nth-child(4n+1) {
        background-color: red;
      } 
      .box:nth-child(4n+2) {
        background-color: yellow;
      } 
      .box:nth-child(4n+3) {
        background-color: blue;
      } 
      .box:nth-child(4n+4) {
        background-color: green;
      } 


    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
      <div class="box">9</div>
      <div class="box">10</div>
      <div class="box">11</div>
      <div class="box">12</div>
    </div>
 
  </body>
</html>
